<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritish</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #f2f2f2;
    --muted: #a0a4ad;
    --accent: #7c9cff;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border-radius: 16px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 2.25rem;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 1rem;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0 0 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  li {
    background: rgba(124, 156, 255, 0.08);
    border: 1px solid rgba(124, 156, 255, 0.2);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 1.05rem;
  }

  a.email {
    display: inline-block;
    color: var(--bg);
    background: var(--accent);
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 600;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  a.email:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124, 156, 255, 0.35);
  }

  @media (max-width: 400px) {
    .card {
      padding: 36px 24px;
    }

    h1 {
      font-size: 1.9rem;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Pritish</h1>
    <p class="subtitle">Hi, I'm Pritish.</p>
    <ul>
      <li>🏏 Play cricket</li>
      <li>🚴 Ride bikes</li>
      <li>✈️ Love travelling</li>
    </ul>
    <a class="email" href="mailto:samalpritish9@gmail.com">Email me</a>
  </div>
</body>
</html>
